name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Un tetto su ogni job: senza, un run appeso tiene un runner fino al limite di sei ore
    # (issue #178). Questo job gira in tre o quattro minuti.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `typecheck` lancia `next typegen` prima di `tsc`, perche' da quando il layout sta sotto
      # `app/[locale]` il codice usa `LayoutProps<"/[locale]">` e `next/root-params`, i cui tipi li
      # genera Next in `.next/types` (ADR 0008). `next typegen` carica `next.config.ts`, che valida
      # l'ambiente: l'URL del sito e' l'unica variabile obbligatoria, e qui non viene letta da niente.
      - run: pnpm typecheck
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    # Il 2026-10-22 questo job e' restato appeso cinque ore e mezza su `playwright install --with-deps`
    # prima che lo cancellassimo. Gira in meno di venti minuti quando non si appende (issue #178).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each test file opens its own SQLite file in memory, with the real migrations (issue #211).
      - run: pnpm test:integration
      # The app is built and tested end to end against a data file of its own, with the real Catalog
      # synced into it: the build reads it too, since the sitemap is prerendered from it.
      - name: Point the app at the E2E data file
        run: |
          {
            echo "VERDICT_DATA_DIR=.e2e-data"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            # Opens the test-only revalidation route the end-to-end tests call.
            echo "E2E_AUTH_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      # The Initial Import reads the real npm and GitHub Sources.
      - run: pnpm catalog:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      # The messages handed to the browser are read off the chunks this build emitted, so a
      # client component that starts using a new one fails here until the list is regenerated.
      - run: pnpm i18n:client-keys --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
