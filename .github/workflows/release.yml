name: Release

# Il pacchetto `verdict-tracker` (issue #214). Su una PR che lo tocca: costruito una volta su Linux,
# installato e avviato su Linux, Windows e macOS. Al tag `vX.Y.Z`, dopo le stesse prove: il file
# iniziale allegato alla Release di GitHub, poi su npm **lo stesso tarball** provato. In quest'ordine,
# perche' il comando scarica il file della sua versione al primo avvio: un pacchetto pubblicato prima
# del suo file sarebbe un primo avvio che fallisce.
#
# Il file iniziale e' quello della Release precedente con sopra le Release nuove del Catalogo: le
# Sintesi gia' pagate passano da una versione all'altra e non si ricomprano. ⚠️ La prima volta non c'e'
# una Release precedente: va creata a mano col file esportato dalla produzione, vedi "Pubblicare una versione" nel README.
#
# Segreti: `NPM_TOKEN` (npm → Access Tokens, granular, scrittura su `verdict-tracker`).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - cli/**
      # Every page is prerendered by the package build: a page can break it (issue #221's demo did).
      - src/**
      - scripts/pack-cli.mts
      - next.config.ts
      - src/proxy.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:cli
      - run: npm pack --pack-destination ../..
        working-directory: dist/cli
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: verdict-tracker-*.tgz

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Install and start it, as `npx` would
        run: |
          mkdir clean data && cd clean && npm init -y > /dev/null
          npm install ../verdict-tracker-*.tgz
          # An empty file: the download of the initial one is for the Release, not for this test.
          touch ../data/verdict.db
          VERDICT_DATA_DIR="$PWD/../data" ./node_modules/.bin/verdict-tracker > ../run.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:7357/technologies && break
            sleep 1
          done
          cat ../run.log
          curl -sf -o /dev/null http://localhost:7357/technologies
          # Only from this machine: a Host that is not localhost is refused (#239).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com:7357' http://localhost:7357/)" = 403

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: The tag is the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: The initial data file
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERDICT_DATA_DIR: initial
        run: |
          mkdir -p initial
          # The latest Release that carries one: this tag's own, when it was made by hand with the file.
          gh release download --pattern verdict.db --dir initial
          pnpm catalog:sync
          # One file, without the write-ahead log beside it.
          node -e "new (require('node:sqlite').DatabaseSync)('initial/verdict.db').exec('pragma wal_checkpoint(truncate); pragma journal_mode = delete')"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" initial/verdict.db --clobber

      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: npm publish verdict-tracker-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
